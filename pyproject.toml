

[project]
name = "booking-cancellation-prediction"                    
version = "0.1.0"
authors = [
    {name = "joey huang", email = "joeysugg1234@gmail.com"}
]

description = "Predict if a booking made in advance by a customer will be cancelled"
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "pandas>=2.0.0",
    "jupyter>=1.1.1",
    "requests>=2.31.0",
    "python-docx>=1.0.0",     
    'numpy>=2.3.5',
    'streamlit>=1.52.2',
    'fastapi>=0.128.0',
    'pydantic>=2.7.0',
    'python-dotenv>=1.0.0',
    'uvicorn[standard]>=0.34.0',
    'psycopg2-binary>=2.9.11',
    'sqlalchemy>=2.0.0',
    'seaborn>=0.13.2',
    'matplotlib>=3.10.6',
    'scikit-learn>=1.8.0',
    'xgboost>=3.1.2.1',
    'joblib>=1.5.3']

# Format: command-name = "package.module:function"
[project.scripts]
ingest_csv = "cli.run_ingest:run_ingest"
run_main = "cli.run_main:run_main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]  # Your code is in src/ folder